exclude = ["dist/**", "node_modules/**"]

targets.codepol-src.language = "typescript"
targets.codepol-src.files = ["packages/*/src/**/*.ts"]

targets.python-src.language = "python"
targets.python-src.files = ["**/*.py"]
targets.python-src.exclude = ["**/venv/**", "**/.venv/**", "**/dist/**", "**/node_modules/**"]

[[plugins]]
id = "@codepol/plugin"
source = { kind = "builtin" }

[[rules]]
ruleId = "@codepol/plugin/eslint"
targets = ["codepol-src"]
args.configPath = "./eslint.config.mjs"

[[rules]]
id = "no-unused-exports"
ruleId = "@codepol/plugin/no-unused-exports"
description = "Detect exported symbols not imported by any other file"
targets = ["codepol-src"]
args.ignorePackageEntryPoints = true

[[rules]]
id = "no-unused-vars"
ruleId = "@codepol/plugin/no-unused-vars"
description = "Detect unused variables"
targets = ["codepol-src"]

[[rules]]
ruleId = "@codepol/plugin/forbidden-words"
severity = "error"
targets = ["codepol-src", "python-src"]
args.words = [
  "handle",
  "process",
  "do",
  "resolve",
  "state",
  "thing",
  "util",
  "helper",
  "yield",
  "generator",
  "stepper",
  "tmp",
  "temp",
]

[[rules]]
ruleId = "@codepol/plugin/forbidden-path-words"
severity = "error"
targets = ["codepol-src", "python-src"]
args.words = [
  "handle",
  "process",
  "do",
  "resolve",
  "state",
  "thing",
  "util",
  "helper",
  "yield",
  "generator",
  "stepper",
  "tmp",
  "temp",
]

[[rules]]
ruleId = "@codepol/plugin/no-verb-function-name"
severity = "error"
targets = ["codepol-src", "python-src"]
args.verbs = [
  "get",
  "set",
  "create",
  "add",
  "update",
  "delete",
  "remove",
  "fetch",
  "load",
  "save",
  "send",
  "receive",
  "parse",
  "format",
  "convert",
  "transform",
  "init",
  "initialize",
  "start",
  "stop",
  "run",
  "execute",
  "extract",
  "compute",
  "calculate",
  "build",
  "make",
  "check",
  "validate",
  "render",
  "find",
  "contains",
]

[[rules]]
ruleId = "@codepol/plugin/no-duplicate-exports"
severity = "error"
targets = ["codepol-src"]
args.identifierTypes = ["function", "variable", "type"]
args.includeReexports = true

[[rules]]
ruleId = "@codepol/plugin/no-interface"
targets = ["codepol-src"]

[[rules]]
ruleId = "@codepol/plugin/no-star-export-collisions"
severity = "error"
targets = ["codepol-src"]
args.includeLocalExports = true

[[rules]]
ruleId = "@codepol/plugin/no-mixed-exports"
severity = "error"
targets = ["codepol-src"]
args.preferredStyle = "named"

[[rules]]
ruleId = "@codepol/plugin/forbidden-declarations"
severity = "error"
targets = ["codepol-src"]
args.symbols = ["class", "interface"]
args.syntax = ["var"]

[[rules]]
id = "enforce-casing"
ruleId = "@codepol/plugin/enforce-casing"
description = "Enforce naming conventions for symbols and file/directory paths"
severity = "warn"
targets = ["codepol-src", "python-src"]

[rules.args.symbols]
function = ["snake_case"]
method = ["snake_case"]
class = ["PascalCase"]
interface = ["PascalCase"]
type = ["PascalCase"]
variable = ["snake_case"]
const = ["snake_case", "SCREAMING_SNAKE_CASE"]
field = ["snake_case"]
parameter = ["snake_case"]
enum = ["PascalCase"]
enumMember = ["PascalCase"]

[rules.args.paths]
file = ["kebab-case", "snake_case"]
directory = ["kebab-case", "snake_case"]
ignoreExtensions = true

[[rules]]
ruleId = "@codepol/plugin/python-dead-code"
description = "Detect unused Python code via Vulture"
targets = ["python-src"]
providers = ["tree-sitter"]
